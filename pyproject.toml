[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfharvest"
version = "0.1.0"
description = "Extract data from PDF documents and export it to Excel."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pdfplumber>=0.10.3",
    "openpyxl>=3.1",
    "pandas>=2.0",
]

[tool.setuptools.packages.find]
include = ["pdfharvest*"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
